<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MawwwHub - Get Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 via-slate-900 to-purple-900 min-h-screen flex items-center justify-center">
    <div class="bg-slate-900/80 backdrop-blur border-2 border-purple-500 rounded-2xl p-8 w-full max-w-md shadow-2xl">
        <h1 class="text-3xl font-bold text-purple-400 text-center mb-2">🔐 MawwwHub</h1>
        <p class="text-slate-400 text-center text-sm mb-6">Dapatkan key gratis untuk akses script</p>

        <div class="bg-slate-800 rounded-lg p-4 mb-4">
            <p class="text-xs text-slate-500 mb-1">Your HWID:</p>
            <p id="hwidDisplay" class="text-purple-300 font-mono text-sm break-all">Loading...</p>
        </div>

        <button onclick="getKey()" id="getKeyBtn"
            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition">
            🎁 GET KEY
        </button>

        <div id="result" class="mt-4 text-center"></div>

        <div class="mt-6 text-xs text-slate-500 text-center">
            Key berlaku 24 jam • 1 key per device
        </div>
    </div>

    <script>
        let hwid = "";
        function generateHWID() {
            let stored = localStorage.getItem("mawww_hwid");
            if (stored) return stored;
            const chars = "abcdef0123456789";
            let id = "";
            for (let i = 0; i < 32; i++) id += chars[Math.floor(Math.random() * chars.length)];
            localStorage.setItem("mawww_hwid", id);
            return id;
        }
        hwid = generateHWID();
        document.getElementById("hwidDisplay").textContent = hwid;

        async function getKey() {
            const btn = document.getElementById("getKeyBtn");
            const result = document.getElementById("result");
            btn.disabled = true;
            btn.textContent = "⏳ Loading...";
            result.innerHTML = "";
            try {
                const res = await fetch(`/api/getkey?hwid=${hwid}`);
                const data = await res.json();
                if (data.ok) {
                    result.innerHTML = `
                        <div class="bg-green-900/50 border border-green-500 rounded-lg p-4">
                            <p class="text-green-400 text-sm mb-2">✅ Key kamu:</p>
                            <div class="bg-slate-900 rounded p-3 font-mono text-green-300 text-sm break-all select-all">${data.key}</div>
                            <button onclick="copyKey('${data.key}')" class="mt-2 text-xs text-green-400 hover:text-green-300">📋 Copy</button>
                        </div>`;
                } else {
                    result.innerHTML = `<div class="bg-red-900/50 border border-red-500 rounded-lg p-3 text-red-300 text-sm">❌ ${data.msg}</div>`;
                }
            } catch (e) {
                result.innerHTML = `<div class="bg-red-900/50 border border-red-500 rounded-lg p-3 text-red-300 text-sm">❌ Error</div>`;
            }
            btn.disabled = false;
            btn.textContent = "🎁 GET KEY";
        }
        function copyKey(key) { navigator.clipboard.writeText(key); alert("Key dicopy!"); }
    </script>
</body>
</html>
